name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hook-tests:
    name: Hook protocol tests (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Run permission hook test suite
        run: ./Scripts/test/permission-hook-test.sh
      - name: Run bridge hook test suite
        run: ./Scripts/test/bridge-hooks-test.sh
      - name: Run OpenCode plugin test suite
        run: ./Scripts/test/opencode-plugin-test.sh
      - name: Run CLI test suite
        run: ./Scripts/test/cli-test.sh
      - name: Run doctor test suite
        run: ./Scripts/test/doctor-test.sh
      - name: Run cloud poller test suite
        run: node --test Scripts/cloud/test/*.test.js

  linux-tests:
    name: Hook + CLI tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run permission hook test suite
        run: ./Scripts/test/permission-hook-test.sh
      - name: Run bridge hook test suite
        run: ./Scripts/test/bridge-hooks-test.sh
      - name: Run OpenCode plugin test suite
        run: ./Scripts/test/opencode-plugin-test.sh
      - name: Run CLI test suite
        run: ./Scripts/test/cli-test.sh
      - name: Run doctor test suite
        run: ./Scripts/test/doctor-test.sh
      - name: Run cloud poller test suite
        run: node --test Scripts/cloud/test/*.test.js

  build:
    name: Build app (universal)
    runs-on: macos-14
    # Provenance needs to mint an OIDC token and write an attestation; everything
    # else in this workflow reads.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - name: Build AgentBar.app
        run: ./Scripts/build.sh
      - name: Verify bundle contents
        run: |
          test -x "build/AgentBar.app/Contents/MacOS/AgentBar"
          test -f "build/AgentBar.app/Contents/Resources/hooks/claude/permission.js"
          test -f "build/AgentBar.app/Contents/Resources/hooks/claude/update.js"
          lipo -archs "build/AgentBar.app/Contents/MacOS/AgentBar" | grep -q "x86_64 arm64"
          # LSUIElement must NOT come back. It hides the dock icon, which main.swift
          # already does with setActivationPolicy(.accessory) — but macOS refuses
          # notification authorization outright to a bundle that declares it: no
          # prompt, and no entry in System Settings to switch on. It looks like the
          # obvious thing to add to a menu bar app, so this is a guard, not a style rule.
          ! /usr/libexec/PlistBuddy -c "Print :LSUIElement" \
              "build/AgentBar.app/Contents/Info.plist" 2>/dev/null
      # The release asset is cut from this bundle. A release has to be signed with
      # the "AgentBar Local Signing" identity — it lives in one keychain, and a
      # signature change makes macOS re-ask every user for folder access — but the
      # machine holding it may not be able to link x86_64 at all (recent Command
      # Line Tools ship libswiftCompatibility*.a for arm64 only). So the universal
      # build happens here and is signed there. `ditto` keeps the bundle's symlinks
      # and resource forks; a plain zip of a .app does not.
      - name: Package the bundle for release
        run: ditto -c -k --sequesterRsrc --keepParent build/AgentBar.app AgentBar.app.zip
      # Says, verifiably, that this exact zip came out of this workflow at this
      # commit. `gh attestation verify AgentBar.app.zip -R michalstrnadel/AgentBar`
      # checks it, and it answers a question this project cannot answer any other
      # way: the release is signed with a certificate that is not Apple's, so the
      # signature proves the bundle was not altered after signing and nothing
      # more. Provenance is what ties it back to a commit anybody can read.
      #
      # Only on push: a pull request from a fork cannot mint the token, and a step
      # that fails for everyone outside the repo is a broken gate, not a strict one.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: AgentBar.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBar-app-universal
          path: AgentBar.app.zip
          retention-days: 14
          if-no-files-found: error

  swift-tests:
    name: Swift unit tests (macOS)
    # swift-testing needs Swift 6; macos-15 ships it, macos-14 does not.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run Swift test suite
        run: swift test
